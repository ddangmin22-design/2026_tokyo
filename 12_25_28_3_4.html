    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS & JS (Cloudflare CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border-radius: 1rem;
            z-index: 10;
        }
        /* Leaflet popup styling override */
        .leaflet-popup-content-wrapper {
            background: #1e293b;
            color: #f8fafc;
            border-radius: 0.75rem;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .leaflet-popup-tip {
            background: #1e293b;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            border: 2px solid white;
            transition: transform 0.2s ease;
        }
        .custom-marker:hover {
            transform: scale(1.2);
        }

        /* OpenStreetMap 다크 테마 필터 (API 키 필요 없는 다크 스타일링) */
        .leaflet-tile-pane {
            filter: brightness(0.85) invert(1) contrast(1.1) hue-rotate(200deg) saturate(0.4);
        }
    </style>

        // Map & Marker Management
        let map;
        let markers = {};
        let routePolylines = {};

        function initMap() {
            // Center between Tokyo and Fuji-Q
            map = L.map('map', {
                zoomControl: false
            }).setView([35.6600, 139.7200], 11);

            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // OpenStreetMap 타일 정책 차단을 회피하고 API 키 없이 100% 오픈된 Esri 지도 타일 적용
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, TomTom',
                maxZoom: 18
            }).addTo(map);

            // Add Itinerary Markers
            itineraryData.forEach(item => {
                const customHtml = `<div class="custom-marker" style="background-color: ${item.color}; width: 34px; height: 34px;">
                    <i class="fa-solid ${item.icon} text-xs"></i>
                </div>`;
                
                const icon = L.divIcon({
                    html: customHtml,
                    className: '',
                    iconSize: [34, 34],
                    iconAnchor: [17, 17]
                });

                const marker = L.marker(item.coords, { icon: icon }).addTo(map);
                marker.bindPopup(`
                    <div class="p-1 max-w-xs">
                        <span class="text-xs font-semibold px-2 py-0.5 rounded text-white" style="background-color:${item.color}">${item.dayLabel}</span>
                        <h4 class="font-bold text-base text-white mt-1.5">${item.title}</h4>
                        <p class="text-xs text-rose-400 mt-0.5"><i class="fa-regular fa-clock mr-1"></i>${item.time}</p>
                        <p class="text-xs text-slate-300 mt-2">${item.desc}</p>
                    </div>
                `);

                markers[item.id] = marker;
            });

            // Add Hotel Markers
            hotelData.forEach(hotel => {
                const customHtml = `<div class="custom-marker" style="background-color: ${hotel.color}; width: 36px; height: 36px; border-color: #fef08a;">
                    <i class="fa-solid fa-hotel text-xs"></i>
                </div>`;
                
                const icon = L.divIcon({
                    html: customHtml,
                    className: '',
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });

                const marker = L.marker(hotel.coords, { icon: icon }).addTo(map);
                marker.bindPopup(`
                    <div class="p-1 max-w-xs">
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-amber-500 text-slate-950">추천 숙소</span>
                        <h4 class="font-bold text-base text-white mt-1.5">${hotel.name}</h4>
                        <p class="text-xs text-amber-300 font-medium">${hotel.tag}</p>
                        <p class="text-xs text-slate-300 mt-2">${hotel.desc}</p>
                    </div>
                `);

                markers[hotel.id] = marker;
            });

            // Create Polyline Route Lines per Day
            const dayRoutes = {
                day1: { color: "#e11d48", coords: [] },
                day2: { color: "#2563eb", coords: [] },
                day3: { color: "#9333ea", coords: [] },
                day4: { color: "#059669", coords: [] }
            };

            itineraryData.forEach(item => {
                if (dayRoutes[item.day]) {
                    dayRoutes[item.day].coords.push(item.coords);
                }
            });

            Object.keys(dayRoutes).forEach(day => {
                const route = dayRoutes[day];
                if (route.coords.length > 1) {
                    const polyline = L.polyline(route.coords, {
                        color: route.color,
                        weight: 3.5,
                        opacity: 0.75,
                        dashArray: '8, 8',
                        lineJoin: 'round'
                    }).addTo(map);
                    routePolylines[day] = polyline;
                }
            });
        }

                        </h3>
                        <p class="text-xs text-slate-300 mt-1.5 leading-relaxed">
                            2일 차 <strong>후지큐 하이랜드 고속버스(바스타 신주쿠) 오픈런</strong>과 첫날 공항/야경 이동 편의성을 고려할 때 <strong>신주쿠역 인근 숙소</strong>가 절대적으로 유리합니다.
                        </p>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', headerHtml);

                hotelData.forEach(hotel => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/50 rounded-2xl p-4 transition cursor-pointer shadow-lg";
                    card.onclick = () => focusOnMap(hotel.id, hotel.coords, 15);
                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">${hotel.tag}</span>
                                <h4 class="text-base font-bold text-white mt-1.5">${hotel.name}</h4>
                                <p class="text-xs text-slate-400 mt-0.5"><i class="fa-solid fa-location-dot mr-1"></i>${hotel.area}</p>
                            </div>
                            <span class="text-xs font-semibold text-slate-300 bg-slate-700/60 px-2.5 py-1 rounded-lg">${hotel.price}</span>
                        </div>
                        <p class="text-xs text-slate-300 mt-3 leading-relaxed">${hotel.desc}</p>
                        <div class="mt-3 text-right">
                            <span class="text-xs text-amber-400 font-medium hover:underline">지도에서 보기 <i class="fa-solid fa-chevron-right text-[10px] ml-1"></i></span>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
                return;
            }

            // Render Day Schedules
            let itemsToRender = itineraryData;
            if (filter !== 'all') {
                itemsToRender = itineraryData.filter(item => item.day === filter);
            }

            if (filter === 'all') {
                // Show Fuji-Q Tip Box on All view
                const tipBox = `
                    <div class="bg-rose-950/40 border border-rose-500/30 rounded-2xl p-4 mb-2">
                        <div class="flex items-center space-x-2 text-rose-400 font-bold text-sm">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>전율미궁 & 일루미네이션 핵심 체크포인트</span>
                        </div>
                        <ul class="text-xs text-slate-300 mt-2 space-y-1.5 list-disc list-inside">
                            <li><strong>12/25 크리스마스 마켓:</strong> 21:30 종료되므로 도착 직후 1순위로 방문하세요.</li>
                            <li><strong>후지큐 전율미궁:</strong> 입장 후 키오스크/앱에서 <strong>시간지정 예약권(유료)</strong>을 즉시 확보해야 체험할 수 있습니다.</li>
                        </ul>
                    </div>
                `;
                listContainer.insertAdjacentHTML('beforeend', tipBox);
            }

            let currentDayHeader = "";

            itemsToRender.forEach(item => {
                if (filter === 'all' && currentDayHeader !== item.dayLabel) {
                    currentDayHeader = item.dayLabel;
                    const dayHeaderHtml = `
                        <div class="sticky top-0 z-10 bg-slate-900/90 backdrop-blur py-2 font-bold text-sm text-slate-300 flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full" style="background-color:${item.color}"></span>
                            <span>${currentDayHeader}</span>
                        </div>
                    `;
                    listContainer.insertAdjacentHTML('beforeend', dayHeaderHtml);
                }

                const card = document.createElement('div');
                card.className = "bg-slate-800/60 hover:bg-slate-800 border border-slate-700/70 hover:border-slate-500 rounded-2xl p-4 transition cursor-pointer shadow-md";
                card.onclick = () => focusOnMap(item.id, item.coords, 14);
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-2.5">
                            <div class="w-8 h-8 rounded-xl flex items-center justify-center text-white shrink-0" style="background-color:${item.color}">
                                <i class="fa-solid ${item.icon} text-xs"></i>
                            </div>
                            <div>
                                <h4 class="text-sm sm:text-base font-bold text-white">${item.title}</h4>
                                <span class="text-xs text-rose-400 font-medium"><i class="fa-regular fa-clock mr-1"></i>${item.time}</span>
                            </div>
                        </div>
                        <span class="text-[11px] font-medium text-slate-400 bg-slate-700/40 px-2 py-0.5 rounded-md border border-slate-600/30">${item.category}</span>
                    </div>
                    <p class="text-xs text-slate-300 mt-2.5 leading-relaxed">${item.desc}</p>
                    <div class="mt-2.5 p-2 bg-slate-950/40 rounded-lg text-[11px] text-amber-300/90 border border-amber-500/10">
                        <i class="fa-solid fa-lightbulb text-amber-400 mr-1"></i>${item.tips}
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // Focus map location and open popup
        function focusOnMap(id, coords, zoomLevel = 14) {
            map.flyTo(coords, zoomLevel, {
                duration: 1.2
            });
            if (markers[id]) {
                setTimeout(() => {
                    markers[id].openPopup();
                }, 800);
            }
        }

        // Switch active tab
        function switchTab(tabKey) {
            activeTab = tabKey;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-rose-600', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.remove('bg-slate-800', 'text-slate-300');
            event.target.classList.add('bg-rose-600', 'text-white');

            renderContent(tabKey);

            // Toggle route polyline visibility & highlighting
            Object.keys(routePolylines).forEach(day => {
                const line = routePolylines[day];
                if (tabKey === 'all') {
                    line.addTo(map);
                    line.setStyle({ opacity: 0.75, weight: 3.5, dashArray: '8, 8' });
                } else if (tabKey === day) {
                    line.addTo(map);
                    line.setStyle({ opacity: 1, weight: 5, dashArray: null });
                } else {
                    map.removeLayer(line);
                }
            });

            // Bounds adjustments
            if (tabKey === 'day2') {
                // Pan map to include Fuji-Q and Shinjuku
                map.flyToBounds([
                    [35.6890, 139.7007],
                    [35.4870, 138.7806]
                ], { padding: [50, 50] });
            } else if (tabKey === 'hotels') {
                map.flyTo([35.6910, 139.7020], 15);
            } else {
                map.flyTo([35.6600, 139.7200], 11);
            }
        }

        // Copy schedule summary toast notification
        function copyScheduleSummary() {
            const summary = `🎄 도쿄 3박 4일 커플 여행 요약 (12/25 ~ 12/28)\n- 12/25: 입국 ➔ 크리스마스 마켓(가이엔) ➔ 롯폰기 일루미네이션\n- 12/26: 신주쿠 버스타 ➔ 후지큐 하이랜드(전율미궁) ➔ 신주쿠 나베/이자카야\n- 12/27: 아사쿠사 ➔ 시부야 스카이 ➔ 오다이바 레인보우 브릿지 야경\n- 12/28: 공항 이동 ➔ 면세점 쇼핑 ➔ 13:00 출국`;
            
            // Clipboard fallback
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = summary;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        // Window load initialization
        window.onload = function() {
            initMap();
            renderContent('all');
        };
    </script>
</body>
</html>
